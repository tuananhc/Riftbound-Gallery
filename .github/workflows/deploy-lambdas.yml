# Deploy the Lambda functions in lambda/ to AWS on every push to master.
#
# The Next.js app is deployed by Vercel, not here — this workflow only ships
# backend code. It runs when a file under lambda/ changes (or when triggered by
# hand from the Actions tab).
#
# Auth is OIDC: GitHub mints a short-lived token and assumes an IAM role. No AWS
# keys are stored in GitHub. Required repo settings:
#   - Variable AWS_DEPLOY_ROLE  = arn:aws:iam::<account-id>:role/<role-name>
#   - Variable AWS_REGION       = ap-southeast-2
# See .github/workflows/README.md for the one-time AWS setup.
#
# Each handler is a single .mjs file with no dependencies (the AWS SDK v3 is
# built into the Node.js runtime), so "build" is just zipping the file with the
# name index.mjs — which matches each function's default handler, index.handler.

name: Deploy Lambdas

on:
  push:
    branches: [master]
    paths:
      - "lambda/**"
      - ".github/workflows/deploy-lambdas.yml"
  workflow_dispatch: # lets you re-deploy by hand without a commit

# Needed for OIDC: id-token writes the federated token, contents reads the repo.
permissions:
  id-token: write
  contents: read

# Never let two deploys race each other onto the same functions.
concurrency:
  group: deploy-lambdas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one bad function shouldn't block the others
      matrix:
        include:
          # source file in lambda/  →  function name in AWS
          - file: saveMatchHistory.mjs
            function: saveMatchHistory
          - file: userProfile.mjs
            function: userProfile
          - file: syncUserProfile.mjs
            function: syncUserProfile
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: node --check "lambda/${{ matrix.file }}"

      - name: Package
        run: |
          cp "lambda/${{ matrix.file }}" index.mjs
          zip -q function.zip index.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy ${{ matrix.function }}
        run: |
          aws lambda update-function-code \
            --function-name "${{ matrix.function }}" \
            --zip-file fileb://function.zip \
            --publish \
            --no-cli-pager
          # Wait for the update to finish so a failed deploy fails the job.
          aws lambda wait function-updated --function-name "${{ matrix.function }}"
